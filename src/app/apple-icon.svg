<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="appleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="60%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="appleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="180" height="180" rx="40" fill="url(#appleBg)" />
  <rect x="2" y="2" width="176" height="176" rx="38" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="4" />

  <!-- Top Server Chassis -->
  <rect x="36" y="38" width="108" height="42" rx="10" fill="#0F172A" fill-opacity="0.55" stroke="#FFFFFF" stroke-width="6" />
  <circle cx="56" cy="59" r="6" fill="#10B981" filter="url(#appleGlow)" />
  <circle cx="73" cy="59" r="6" fill="#38BDF8" filter="url(#appleGlow)" />
  <line x1="96" y1="59" x2="124" y2="59" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-opacity="0.9" />

  <!-- Bottom Server Chassis -->
  <rect x="36" y="94" width="108" height="42" rx="10" fill="#0F172A" fill-opacity="0.55" stroke="#FFFFFF" stroke-width="6" />
  <circle cx="56" cy="115" r="6" fill="#F59E0B" filter="url(#appleGlow)" />
  <path d="M74 109 L81 115 L74 121" fill="none" stroke="#34D399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="91" y1="121" x2="106" y2="121" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="60%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Icon Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />
  <!-- Inner Subtle Glass Border -->
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Top Server Chassis -->
  <rect x="13" y="14" width="38" height="15" rx="4" fill="#0F172A" fill-opacity="0.5" stroke="#FFFFFF" stroke-width="2.5" />
  <!-- Top Server LEDs -->
  <circle cx="20" cy="21.5" r="2.2" fill="#10B981" filter="url(#glow)" />
  <circle cx="26" cy="21.5" r="2.2" fill="#38BDF8" filter="url(#glow)" />
  <!-- Drive Slot lines -->
  <line x1="34" y1="21.5" x2="44" y2="21.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.9" />

  <!-- Bottom Server Chassis -->
  <rect x="13" y="33" width="38" height="15" rx="4" fill="#0F172A" fill-opacity="0.5" stroke="#FFFFFF" stroke-width="2.5" />
  <!-- Bottom Server LEDs -->
  <circle cx="20" cy="40.5" r="2.2" fill="#F59E0B" filter="url(#glow)" />
  <!-- DevOps Terminal Prompt: > _ -->
  <path d="M27 38.5 L29.5 40.5 L27 42.5" fill="none" stroke="#34D399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="33" y1="42.5" x2="38" y2="42.5" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" />
</svg>
